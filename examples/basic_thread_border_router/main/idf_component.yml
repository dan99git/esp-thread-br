## IDF Component Manager Manifest File
dependencies:
  espressif/mdns: "^1.0.0"
  espressif/esp_ot_cli_extension:
    version: "~2.0.0"
  espressif/esp_rcp_update:
    version: "~1.6.0"
  esp_br_http_ota:
    path: ../../../components/esp_br_http_ota
  esp_ot_br_server:
    path: ../../../components/esp_ot_br_server
  thread_border_router:
    path: ../../common/thread_border_router
  protocol_examples_common:
    path: ${IDF_PATH}/examples/common_components/protocol_examples_common
  # LOOP A 2026-06-13: installed IDF v5.5 does not ship ot_examples_common at
  # the pinned ${IDF_PATH} path. Reuse the same local helper the
  # building_os_border_router example builds against, so host code stays stock.
  ot_examples_common:
    path: ../../building_os_border_router/local_helpers/ot_examples_common

  ## Required IDF version
  idf:
    version: ">=5.1.0"
